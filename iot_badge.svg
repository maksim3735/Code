<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Темний фон з градієнтом -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Кібер-неоновий градієнт (фіолетово-блакитний) -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Напівпрозора неонова тінь / світіння -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#8b5cf6" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- 1. Базова підкладка (округлений квадрат іконки) -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bgGrad)" stroke="url(#neonGrad)" stroke-width="4" />

  <!-- 2. Декоративне зовнішнє кільце (Ellipse/Circle) -->
  <circle cx="128" cy="128" r="82" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="12 8" opacity="0.5" />

  <!-- 3. Центральний шестикутник (Polygon) зі світінням -->
  <polygon points="128,58 188,93 188,163 128,198 68,163 68,93" fill="#1e1b4b" fill-opacity="0.8" stroke="url(#neonGrad)" stroke-width="5" filter="url(#neonGlow)" />

  <!-- 4. Векторні лінії з'єднання / контури мікросхеми (Path) -->
  <path d="M 128 58 L 128 96 M 188 163 L 155 144 M 68 163 L 101 144" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" />

  <!-- 5. Центральне ядро статусу (Circle) -->
  <circle cx="128" cy="128" r="24" fill="url(#neonGrad)" filter="url(#neonGlow)" />
  <circle cx="128" cy="128" r="10" fill="#0f172a" />

  <!-- 6. Індикатор активного статусу (Online dot) у кутку -->
  <circle cx="196" cy="60" r="10" fill="#10b981" stroke="#0f172a" stroke-width="3" />
</svg>